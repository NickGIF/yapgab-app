# YapGab — Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# IMPORTANT: This file configures deploy behaviour and variables only.
# The service image source must be set to the Docker Hub image
#   nicknicknicknicko/yapgab:latest
# in the Railway template editor (Service → Source → Docker Image).
# Do NOT configure a Dockerfile build — the image is pre-built and published.

[deploy]
  healthcheckPath     = "/api/license/version"
  healthcheckTimeout  = 300
  restartPolicyType   = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[variables]
  NODE_ENV              = "production"
  PORT                  = "5000"
  # Wired automatically from the Railway PostgreSQL plugin — customers never type this
  DATABASE_URL          = "${{Postgres.DATABASE_URL}}"
  # Generated once by Railway — customers never type these
  SESSION_SECRET        = "${{secret(64)}}"
  CONFIG_ENCRYPTION_KEY = "${{secret(64)}}"
  # ── CUSTOMER ENTERS THIS ONE VALUE ─────────────────────────────────────────
  # YAPGAB_LICENSE_KEY = "<paste your license key here>"
